  band: {high: התאמה גבוהה, medium: התאמה בינונית, low: התאמה נמוכה}
  via: {search: חיפוש סמנטי, location: אזור תכנון, zone: אזור יעוד, general: הוראות כלליות לקטגוריית היעוד, notes: הערות לטבלה 5.4, section: המשך הטבלה או הסעיף, heading: כותרת שצוינה בשאלה, ref: הפניה, focus_note: מיקוד לפי שכבת מפה}
  context:
    band: רמת התאמה
    low_note: ייתכן שהתכנית אינה כוללת מענה לשאלה
    areas: אזורי תכנון
    zones: אזורי יעוד
    no_record: אזורי תכנון שאינם מופיעים בטבלה 5.4 (אין הוראות מיוחדות)
